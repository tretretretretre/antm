version: 1
updated: 2026-08-24

policy:
  objective: least_expensive_capable_model
  default_effort: low
  escalation:
    medium: synthesis_drafting_or_ordinary_strategy
    high: research_judgment_final_review_or_major_strategy
    xhigh_max: manual_only
  job_overrides: must_be_documented
  mixture_of_agents: disabled_by_default
  prohibited_runtime_models:
    - claude
    - anthropic/*

