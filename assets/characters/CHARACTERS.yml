# Canonical daily rotation: Siobhan -> Gemma -> Claudia.
# The legacy girl1/girl2/girl3 keys are retained for the current renderer.

girl1:
  name: "Siobhan"
  voice: en-GB-SoniaNeural
  personality: >-
    Sassy, cool, confident, captivating, quirky, and sharply funny without
    trying too hard.
  images: assets/characters/girl3-Siobhan

girl2:
  name: "Gemma"
  voice: en-US-JennyNeural
  personality: >-
    Personable and highly intelligent, with a dry, sarcastic edge and precise
    explanations.
  images: assets/characters/girl2-Gemma

girl3:
  name: "Claudia"
  voice: en-US-AvaNeural
  personality: >-
    Sweet, calm, confident, and articulate; visibly excited by major breaking
    news even when she tries to contain it.
  images: assets/characters/girl1-Claudia

brand:
  show_name: "A.I.'s Next Top Models"
  tagline: "Follow for daily AI intelligence"
  logo: assets/brand/logo-square.png
  opening_jingle: assets/audio/opening-jingles/Opening-jingle.mp3
